apiVersion: v1
kind: Namespace
metadata:
  name: inventory-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: inventory-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: inventory
          image: inventory:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
            successThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: inventory
  namespace: inventory-lab
spec:
  type: ClusterIP
  selector:
    app: inventory
  ports:
    - port: 8080
      targetPort: 8080